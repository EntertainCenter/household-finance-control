<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home Finance Management - Bills</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="topbar">
    <div>
      <h1>Home Finance Management</h1>
      <p>Manage Bills</p>
    </div>

    <div class="topbar-actions">
      <a href="index.html" class="nav-btn">Dashboard</a>
      <button id="logoutBtn" class="secondary-btn">Sign Out</button>
    </div>
  </header>


  <main class="container">

    <section class="page-heading">
      <div>
        <h2>Recurring Bills</h2>
        <p>
          Update payments, next due dates, end dates, and active status.
        </p>
      </div>
    </section>


    <div id="billMessage" class="message-box hidden"></div>


    <section class="card">
      <div class="table-scroll">

        <table class="finance-table bills-table">
          <thead>
            <tr>
              <th>Bill</th>
              <th>Amount</th>
              <th>Frequency</th>
              <th>Next Due</th>
              <th>Ends</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="billTableBody">
          </tbody>
        </table>

      </div>
    </section>


    <!-- ================================================= -->
    <!-- EDIT MODAL -->
    <!-- ================================================= -->

    <div id="billModal" class="modal hidden">

      <div class="modal-card">

        <div class="modal-header">
          <h2>Edit Bill</h2>

          <button
            id="closeModalBtn"
            class="icon-btn"
            type="button"
          >
            ×
          </button>
        </div>


        <input type="hidden" id="billId" />


        <label for="billName">Bill Name</label>
        <input id="billName" type="text" />


        <label for="billAmount">Amount</label>
        <input
          id="billAmount"
          type="number"
          min="0"
          step="0.01"
        />


        <label for="billFrequency">Frequency</label>

        <select id="billFrequency">
          <option value="weekly">Weekly</option>
          <option value="biweekly">Biweekly</option>
          <option value="semi-monthly">Semi-monthly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annual">Annual</option>
        </select>


        <label for="billNextDue">Next Due Date</label>
        <input
          id="billNextDue"
          type="date"
        />


        <label for="billEndDate">
          End Date
          <span class="field-note">
            optional
          </span>
        </label>

        <input
          id="billEndDate"
          type="date"
        />


        <label for="billFinalPayment">
          Final Payment Amount
          <span class="field-note">
            optional
          </span>
        </label>

        <input
          id="billFinalPayment"
          type="number"
          min="0"
          step="0.01"
        />


        <label class="checkbox-row">
          <input
            id="billEssential"
            type="checkbox"
          />
          Essential / protected bill
        </label>


        <label class="checkbox-row">
          <input
            id="billAutopay"
            type="checkbox"
          />
          Automatic payment
        </label>


        <label class="checkbox-row">
          <input
            id="billActive"
            type="checkbox"
          />
          Active
        </label>


        <label for="billNotes">Notes</label>

        <textarea
          id="billNotes"
          rows="4"
        ></textarea>


        <div class="modal-actions">

          <button
            id="cancelBillBtn"
            class="secondary-btn"
            type="button"
          >
            Cancel
          </button>

          <button
            id="saveBillBtn"
            type="button"
          >
            Save Changes
          </button>

        </div>

      </div>
    </div>

  </main>


  <script>
    const SUPABASE_URL =
      "https://lypfuqoxqxtdocgmryiy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_R81PDNKu5TIet3zO8Qj0cA_ON7fDWIA";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function money(value) {

      return Number(value || 0)
        .toLocaleString(
          "en-CA",
          {
            style: "currency",
            currency: "CAD"
          }
        );

    }


    function prettyDate(value) {

      if (!value) {
        return "—";
      }

      const date =
        new Date(value + "T00:00:00");

      return date.toLocaleDateString(
        "en-CA",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();

      if (!session) {

        window.location.href =
          "login.html";

        return false;

      }

      return true;

    }


    async function loadBills() {

      const { data, error } =
        await supabaseClient
          .from("bills")
          .select(`
            id,
            bill_name,
            category,
            amount,
            frequency,
            next_due_date,
            end_date,
            final_payment_amount,
            autopay,
            essential,
            active,
            notes
          `)
          .order(
            "active",
            { ascending: false }
          )
          .order(
            "next_due_date",
            { ascending: true }
          );


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;

      }


      const tbody =
        document.getElementById(
          "billTableBody"
        );

      tbody.innerHTML = "";


      data.forEach(bill => {

        const tr =
          document.createElement("tr");


        if (!bill.active) {
          tr.classList.add("inactive-row");
        }


        tr.innerHTML = `
          <td>
            <strong>${bill.bill_name}</strong>
            <div class="small-text">
              ${bill.category || ""}
            </div>
          </td>

          <td>
            ${money(bill.amount)}
          </td>

          <td>
            ${bill.frequency || ""}
          </td>

          <td>
            ${prettyDate(bill.next_due_date)}
          </td>

          <td>
            ${prettyDate(bill.end_date)}
          </td>

          <td>
            ${
              bill.active
                ? '<span class="status-chip active-chip">Active</span>'
                : '<span class="status-chip inactive-chip">Inactive</span>'
            }
          </td>

          <td>
            <button
              class="small-btn"
              onclick='editBill(${JSON.stringify(bill)})'
            >
              Edit
            </button>
          </td>
        `;


        tbody.appendChild(tr);

      });

    }


    function editBill(bill) {

      document.getElementById(
        "billId"
      ).value =
        bill.id;


      document.getElementById(
        "billName"
      ).value =
        bill.bill_name || "";


      document.getElementById(
        "billAmount"
      ).value =
        bill.amount ?? "";


      document.getElementById(
        "billFrequency"
      ).value =
        bill.frequency || "monthly";


      document.getElementById(
        "billNextDue"
      ).value =
        bill.next_due_date || "";


      document.getElementById(
        "billEndDate"
      ).value =
        bill.end_date || "";


      document.getElementById(
        "billFinalPayment"
      ).value =
        bill.final_payment_amount ?? "";


      document.getElementById(
        "billEssential"
      ).checked =
        Boolean(bill.essential);


      document.getElementById(
        "billAutopay"
      ).checked =
        Boolean(bill.autopay);


      document.getElementById(
        "billActive"
      ).checked =
        Boolean(bill.active);


      document.getElementById(
        "billNotes"
      ).value =
        bill.notes || "";


      document
        .getElementById("billModal")
        .classList
        .remove("hidden");

    }


    function closeModal() {

      document
        .getElementById("billModal")
        .classList
        .add("hidden");

    }


    async function saveBill() {

      const id =
        document.getElementById(
          "billId"
        ).value;


      const amount =
        Number(
          document.getElementById(
            "billAmount"
          ).value
        );


      if (!id) {
        return;
      }


      if (
        !Number.isFinite(amount)
        || amount < 0
      ) {

        showMessage(
          "Please enter a valid payment amount.",
          true
        );

        return;

      }


      const updateData = {

        bill_name:
          document.getElementById(
            "billName"
          ).value.trim(),

        amount,

        frequency:
          document.getElementById(
            "billFrequency"
          ).value,

        next_due_date:
          document.getElementById(
            "billNextDue"
          ).value || null,

        end_date:
          document.getElementById(
            "billEndDate"
          ).value || null,

        final_payment_amount:
          document.getElementById(
            "billFinalPayment"
          ).value
            ? Number(
                document.getElementById(
                  "billFinalPayment"
                ).value
              )
            : null,

        essential:
          document.getElementById(
            "billEssential"
          ).checked,

        autopay:
          document.getElementById(
            "billAutopay"
          ).checked,

        active:
          document.getElementById(
            "billActive"
          ).checked,

        notes:
          document.getElementById(
            "billNotes"
          ).value.trim() || null,

        last_confirmed_date:
          new Date()
            .toISOString()
            .split("T")[0]

      };


      const { error } =
        await supabaseClient
          .from("bills")
          .update(updateData)
          .eq("id", id);


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;

      }


      closeModal();

      showMessage(
        "Bill updated successfully.",
        false
      );

      await loadBills();

    }


    function showMessage(
      text,
      isError
    ) {

      const box =
        document.getElementById(
          "billMessage"
        );

      box.textContent = text;

      box.className =
        isError
          ? "message-box error-message"
          : "message-box success-message";


      setTimeout(
        () => {
          box.classList.add("hidden");
        },
        3500
      );

    }


    document
      .getElementById("saveBillBtn")
      .addEventListener(
        "click",
        saveBill
      );


    document
      .getElementById("cancelBillBtn")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("closeModalBtn")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          window.location.href =
            "login.html";

        }
      );


    async function start() {

      const loggedIn =
        await checkLogin();

      if (!loggedIn) {
        return;
      }

      await loadBills();

    }


    start();
  </script>

</body>
</html>
