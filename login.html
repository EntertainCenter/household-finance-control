<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Finance Management - Login</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <h1>Home Finance Management</h1>
    <p class="muted">Sign in to view your household finances.</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" />

    <button id="loginBtn">Sign In</button>

    <p id="loginMessage" class="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://lypfuqoxqxtdocgmryiy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R81PDNKu5TIet3zO8Qj0cA_ON7fDWIA";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("loginMessage");

      message.textContent = "Signing in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.href = "index.html";
    });
  </script>

</body>
</html>
