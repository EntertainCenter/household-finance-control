<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home Finance Management - Accounts</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="topbar">

    <div>
      <h1>Home Finance Management</h1>
      <p>Manage Accounts</p>
    </div>

    <div class="topbar-actions">

      <a
        href="index.html"
        class="nav-btn"
      >
        Dashboard
      </a>

      <a
        href="bills.html"
        class="nav-btn"
      >
        Bills
      </a>

      <button
        id="logoutBtn"
        class="secondary-btn"
      >
        Sign Out
      </button>

    </div>

  </header>


  <main class="container">

    <section class="page-heading">

      <div>
        <h2>Household Accounts</h2>

        <p>
          Update the current balance of each household account.
        </p>
      </div>

    </section>


    <div
      id="accountMessage"
      class="message-box hidden"
    ></div>


    <section
      id="accountsGrid"
      class="dashboard-grid"
    >
    </section>

  </main>


  <!-- ================================================= -->
  <!-- EDIT ACCOUNT MODAL -->
  <!-- ================================================= -->

  <div
    id="accountModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>Edit Account</h2>

        <button
          id="closeModalBtn"
          class="icon-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <input
        type="hidden"
        id="accountId"
      />


      <label for="accountName">
        Account Name
      </label>

      <input
        id="accountName"
        type="text"
      />


      <label for="accountBalance">
        Current Balance
      </label>

      <input
        id="accountBalance"
        type="number"
        step="0.01"
      />


      <label for="protectedFloor">
        Protected Floor
      </label>

      <input
        id="protectedFloor"
        type="number"
        min="0"
        step="0.01"
      />


      <label class="checkbox-row">

        <input
          id="includeAvailableCash"
          type="checkbox"
        />

        Include in available cash

      </label>


      <label class="checkbox-row">

        <input
          id="accountActive"
          type="checkbox"
        />

        Active

      </label>


      <label for="accountNotes">
        Notes
      </label>

      <textarea
        id="accountNotes"
        rows="4"
      ></textarea>


      <div class="modal-actions">

        <button
          id="cancelAccountBtn"
          class="secondary-btn"
          type="button"
        >
          Cancel
        </button>

        <button
          id="saveAccountBtn"
          type="button"
        >
          Save Changes
        </button>

      </div>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://lypfuqoxqxtdocgmryiy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_R81PDNKu5TIet3zO8Qj0cA_ON7fDWIA";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function money(value) {

      return Number(value || 0)
        .toLocaleString(
          "en-CA",
          {
            style: "currency",
            currency: "CAD"
          }
        );

    }


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href =
          "login.html";

        return false;

      }


      return true;

    }


    async function loadAccounts() {

      const { data, error } =
        await supabaseClient
          .from("accounts")
          .select(`
            id,
            account_name,
            account_type,
            current_balance,
            protected_floor,
            include_in_available_cash,
            active,
            notes
          `)
          .order(
            "account_name",
            { ascending: true }
          );


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;

      }


      const grid =
        document.getElementById(
          "accountsGrid"
        );


      grid.innerHTML = "";


      data.forEach(account => {

        const card =
          document.createElement("div");


        card.className =
          "card account-edit-card";


        const aboveFloor =
          Number(account.current_balance || 0)
          -
          Number(account.protected_floor || 0);


        card.innerHTML = `

          <h3>
            ${account.account_name}
          </h3>

          <div class="big-number">
            ${money(account.current_balance)}
          </div>

          <p>
            Type:
            <strong>
              ${account.account_type || ""}
            </strong>
          </p>

          <p>
            Protected floor:
            <strong>
              ${money(account.protected_floor)}
            </strong>
          </p>

          <p>
            Above floor:
            <strong>
              ${money(aboveFloor)}
            </strong>
          </p>

          <p>
            ${
              account.active
                ? '<span class="status-chip active-chip">Active</span>'
                : '<span class="status-chip inactive-chip">Inactive</span>'
            }
          </p>

          <button
            class="small-btn"
            onclick='editAccount(${JSON.stringify(account)})'
          >
            Edit Account
          </button>

        `;


        grid.appendChild(card);

      });

    }


    function editAccount(account) {

      document.getElementById(
        "accountId"
      ).value =
        account.id;


      document.getElementById(
        "accountName"
      ).value =
        account.account_name || "";


      document.getElementById(
        "accountBalance"
      ).value =
        account.current_balance ?? "";


      document.getElementById(
        "protectedFloor"
      ).value =
        account.protected_floor ?? 0;


      document.getElementById(
        "includeAvailableCash"
      ).checked =
        Boolean(
          account.include_in_available_cash
        );


      document.getElementById(
        "accountActive"
      ).checked =
        Boolean(account.active);


      document.getElementById(
        "accountNotes"
      ).value =
        account.notes || "";


      document
        .getElementById(
          "accountModal"
        )
        .classList
        .remove("hidden");

    }


    function closeModal() {

      document
        .getElementById(
          "accountModal"
        )
        .classList
        .add("hidden");

    }


    async function saveAccount() {

      const id =
        document.getElementById(
          "accountId"
        ).value;


      const balance =
        Number(
          document.getElementById(
            "accountBalance"
          ).value
        );


      const floor =
        Number(
          document.getElementById(
            "protectedFloor"
          ).value
        );


      if (!id) {
        return;
      }


      if (!Number.isFinite(balance)) {

        showMessage(
          "Please enter a valid account balance.",
          true
        );

        return;

      }


      if (
        !Number.isFinite(floor)
        || floor < 0
      ) {

        showMessage(
          "Please enter a valid protected floor.",
          true
        );

        return;

      }


      const updateData = {

        account_name:
          document.getElementById(
            "accountName"
          ).value.trim(),

        current_balance:
          balance,

        protected_floor:
          floor,

        include_in_available_cash:
          document.getElementById(
            "includeAvailableCash"
          ).checked,

        active:
          document.getElementById(
            "accountActive"
          ).checked,

        notes:
          document.getElementById(
            "accountNotes"
          ).value.trim() || null

      };


      const { error } =
        await supabaseClient
          .from("accounts")
          .update(updateData)
          .eq("id", id);


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;

      }


      closeModal();


      showMessage(
        "Account updated successfully.",
        false
      );


      await loadAccounts();

    }


    function showMessage(
      text,
      isError
    ) {

      const box =
        document.getElementById(
          "accountMessage"
        );


      box.textContent =
        text;


      box.className =
        isError
          ? "message-box error-message"
          : "message-box success-message";


      setTimeout(
        () => {
          box.classList.add("hidden");
        },
        3500
      );

    }


    document
      .getElementById(
        "saveAccountBtn"
      )
      .addEventListener(
        "click",
        saveAccount
      );


    document
      .getElementById(
        "cancelAccountBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "closeModalBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "logoutBtn"
      )
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          window.location.href =
            "login.html";

        }
      );


    async function start() {

      const loggedIn =
        await checkLogin();


      if (!loggedIn) {
        return;
      }


      await loadAccounts();

    }


    start();

  </script>

</body>
</html>
